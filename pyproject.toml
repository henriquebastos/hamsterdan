[project]
name = "hamsterdan"
version = "0.1.0"
description = "Hamsterdan — a GitHub-native PR-readiness application powered by Petrus."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Henrique Bastos", email = "henrique@bastos.net" },
]
dependencies = [
    "cryptography>=46,<51",
    "fastapi>=0.116,<1",
    "githubkit[auth-app]==0.16.0",
    "petrus @ git+https://github.com/henriquebastos/petrus.git@44cac5ff48ac371ebae56323941983f30db13c0d",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "ansible-core>=2.19,<2.20",
    "ast-grep-cli>=0.44.0",
    "build>=1.5,<2",
    "httpx>=0.28,<1",
    "httpx2>=2.9,<3",
    "hypothesis>=6,<7",
    "mutmut==3.6.0",
    "pytest>=8.3",
    "pytest-randomly>=4,<5",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.8",
    "ty==0.0.63",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
only-include = ["src/hamsterdan"]

[tool.hatch.build.targets.wheel]
packages = ["src/hamsterdan"]

[tool.pytest.ini_options]
addopts = "--randomly-seed=1729"
testpaths = ["tests", "deployment/tests"]
timeout = 30
markers = [
    "real_provider_acceptance: opt-in tests that may invoke authenticated external provider clients",
    "linux_orb_setup: tests that exercise the GNU/Linux Orb command contract",
]

[tool.mutmut]
source_paths = ["src/hamsterdan"]
only_mutate = ["src/hamsterdan/host/v5/rerun.py"]
pytest_add_cli_args = ["-o", "addopts=", "-q"]
pytest_add_cli_args_test_selection = ["tests/unit/host/test_v5_rerun.py"]
timeout_multiplier = 5
timeout_constant = 0.2

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint.mccabe]
max-complexity = 10
