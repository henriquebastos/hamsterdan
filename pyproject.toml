[project]
name = "hamsterdan"
version = "0.0.0"
description = "Hamsterdan — a GitHub-native PR-readiness application powered by Petrus."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Henrique Bastos", email = "henrique@bastos.net" },
]
dependencies = [
    "cryptography>=46,<51",
    "fastapi>=0.116,<1",
    "githubkit[auth-app]==0.16.0",
    "petrus @ git+https://github.com/henriquebastos/petrus.git@5ded726a339907175e5af6eb79cda9ab66816308",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "build>=1.5,<2",
    "httpx>=0.28,<1",
    "httpx2>=2.9,<3",
    "hypothesis>=6,<7",
    "pytest>=8.3",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.8",
    "ty==0.0.63",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
only-include = ["src/hamsterdan"]

[tool.hatch.build.targets.wheel]
packages = ["src/hamsterdan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "real_provider_acceptance: opt-in tests that may invoke authenticated external provider clients",
]

[tool.ruff]
line-length = 120
target-version = "py314"
