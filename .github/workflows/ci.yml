name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Configure Petrus dependency authentication
        env:
          PETRUS_GITHUB_TOKEN: ${{ secrets.PETRUS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/petrus-git-auth"
          umask 077
          mkdir -p "$auth_dir"
          printf 'https://x-access-token:%s@github.com\n' "$PETRUS_GITHUB_TOKEN" > "$auth_dir/credentials"
          git config --file "$auth_dir/config" credential.helper "store --file=$auth_dir/credentials"
      - name: Install dependencies
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/petrus-git-auth/config
        run: uv sync --frozen
      - name: Remove Petrus dependency authentication
        if: always()
        run: rm -rf "$RUNNER_TEMP/petrus-git-auth"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install demo-video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd tools/demo-video
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - run: scripts/check full
