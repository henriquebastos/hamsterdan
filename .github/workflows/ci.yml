name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Load the build credential from 1Password
        uses: 1password/load-secrets-action@v4
        id: build-secrets
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BUILD }}
          PETRUS_GITHUB_TOKEN: op://hamsterdan-build/petrus-github-token/credential
      - name: Configure Petrus dependency authentication
        env:
          PETRUS_GITHUB_TOKEN: ${{ steps.build-secrets.outputs.PETRUS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/petrus-git-auth"
          umask 077
          mkdir -p "$auth_dir"
          printf 'https://x-access-token:%s@github.com\n' "$PETRUS_GITHUB_TOKEN" > "$auth_dir/credentials"
          git config --file "$auth_dir/config" credential.helper "store --file=$auth_dir/credentials"
      - name: Install dependencies
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/petrus-git-auth/config
        run: uv sync --frozen
      - name: Remove Petrus dependency authentication
        if: always()
        run: rm -rf "$RUNNER_TEMP/petrus-git-auth"
      - run: scripts/check tests
